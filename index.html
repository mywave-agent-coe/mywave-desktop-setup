<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyWave Desktop Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      color: #333;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      padding: 48px 40px;
      max-width: 440px;
      width: 90%;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .message {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #0066cc;
      color: #fff;
    }

    .btn-primary:hover {
      background: #0052a3;
    }

    .btn-secondary {
      background: transparent;
      color: #0066cc;
      font-size: 14px;
      margin-top: 16px;
    }

    .btn-secondary:hover {
      text-decoration: underline;
    }

    .error {
      color: #cc0000;
      font-size: 14px;
      margin-top: 16px;
      display: none;
    }

    .status {
      color: #666;
      font-size: 14px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MyWave Desktop</div>
    <div class="subtitle">Setup Configuration</div>

    <div id="content-ready">
      <p class="message">Open MyWave Desktop to apply your configuration?</p>
      <a id="open-link" class="btn btn-primary" href="#">Open in MyWave Desktop</a>
      <p class="status" id="status">Attempting to open MyWave Desktop...</p>
      <p class="error" id="error"></p>
    </div>

    <div id="content-missing" style="display: none;">
      <p class="message">Invalid setup link. Please check the link in your email and try again.</p>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sasUrl = params.get("url");

      if (!sasUrl) {
        document.getElementById("content-ready").style.display = "none";
        document.getElementById("content-missing").style.display = "block";
        return;
      }

      var deepLink = "mywave://setup?url=" + encodeURIComponent(sasUrl);
      var openBtn = document.getElementById("open-link");
      var status = document.getElementById("status");

      openBtn.href = deepLink;

      openBtn.addEventListener("click", function () {
        status.textContent = "If the app didn’t open, make sure MyWave Desktop is installed.";
      });

      // Auto-redirect attempt
      window.location = deepLink;

      // If still here after 2 seconds, the app probably didn't open
      setTimeout(function () {
        status.textContent = "Click the button above to open MyWave Desktop.";
      }, 2000);
    })();
  </script>
</body>
</html>
